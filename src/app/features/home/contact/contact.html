<section id="contacto" class="contact-section" aria-labelledby="contact-title">
  <div class="container contact-panel">
    <div class="contact-top eyebrow">
      <span i18n="@@contact.label">05 / El próximo paso</span
      ><span aria-hidden="true" i18n="@@contact.topNote">[ Construyamos algo que funcione. ]</span>
    </div>
    <div class="contact-body">
      <h2 id="contact-title" i18n="@@contact.title">
        Conversemos sobre<br />lo que necesitás<br /><span>construir.</span>
      </h2>
      <div class="contact-action">
        <p i18n="@@contact.intro">
          Contanos qué pasa hoy, qué sistemas usás y qué necesitás cambiar.
        </p>
        <a class="button contact-button" routerLink="/contacto"
          ><span i18n="@@contact.emailCta">Hablemos de tu proyecto</span><app-arrow /></a
        ><span class="contact-note" i18n="@@contact.formNote"
          >El contexto de tu empresa es un buen punto de partida.</span
        >
      </div>
    </div>
    <div class="contact-bottom eyebrow">
      <span>ALANT / Software Engineering Studio</span><span aria-hidden="true">↗</span>
    </div>
  </div>
</section>
