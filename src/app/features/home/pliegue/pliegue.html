<div
  class="sculpture"
  role="img"
  aria-label="Composición escultórica de tres planos arquitectónicos en blanco, graphite y mint. Se separan y reorganizan al desplazarse por la página."
  i18n-aria-label
>
  <div class="scene-top" aria-hidden="true"><span>ALANT / 01</span><span>01—03</span></div>
  <div class="scene-space" aria-hidden="true">
    <div class="assembly">
      <div class="plate plate-mint">
        <div class="plane-face">
          <span class="engraving" i18n>IDEA.<br />FORMA.<br />IMPACTO.</span
          ><span class="plane-index">03</span>
          <div class="mint-grooves"></div>
        </div>
        <div class="plane-side"></div>
        <div class="plane-bottom"></div>
      </div>
      <div class="plate plate-frame">
        <div class="frame-face">
          <span class="frame-detail"></span><span class="edge-light"></span>
        </div>
        <div class="frame-back"></div>
      </div>
      <div class="plate plate-paper">
        <div class="paper-face">
          <span class="paper-index">01 /</span>
          <div class="paper-cutout"></div>
          <span class="paper-note" i18n>DISEÑAR.<br />CONSTRUIR.</span>
        </div>
        <div class="paper-back"></div>
      </div>
    </div>
    <div class="floor-shadow"></div>
  </div>
  <div class="scene-bottom" aria-hidden="true"><span>PRECISION / MINT</span><span>↓</span></div>
  <div class="scene-rule" aria-hidden="true"><span></span></div>
</div>
